    after: []
    before: ["bmad-code-review"]

  bmad-code-review:
    aliases: ["code-review"]
    display_name: "Code Review"
    phase: "4-implementation"
    status_triggers: ["review"]
    allowed_from: ["bmad-dev-story"]
    recommended_skill: "bmad-code-review"
    required: false
    description: "Review implementation. Routes back to dev-story if issues found, or to qa-gate if passed."
